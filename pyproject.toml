[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-fluxvla"
version = "0.1.0"
description = "PI0.5 Piper and subtask training, export, offline evaluation and inference"
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
  "numpy==1.26.4", "torch==2.8.0", "torchvision==0.23.0",
  "transformers==5.3.0", "accelerate==0.33.0", "mmengine==0.10.7",
  "datasets==4.0.0", "pyarrow==21.0.0", "pandas>=2.2,<3",
  "timm==0.9.10", "draccus==0.10.0",
  "einops==0.4.1", "opencv-python-headless<4.12", "av", "safetensors",
  "sentencepiece", "jsonlines", "PyYAML", "rich", "tqdm", "wandb", "zstandard",
  "scipy>=1.11,<1.16", "Pillow>=10",
]

[project.optional-dependencies]
cache = ["decord2==3.4.0"]
benchmark = ["zstandard", "lz4"]
test = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
include = ["fluxvla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
